{% extends 'layouts/base.html' %}
{% block content %}
<div class="container" style="max-width: 900px; margin: 40px auto;">
    <h2 style="font-weight: 800; color: var(--text-dark); margin-bottom: 30px;">
        <i class="fa-solid fa-file-import" style="color: #10b981;"></i> Cấu hình & Nhập dữ liệu
    </h2>

    <div class="glass-card" style="padding: 30px;">
        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px;">
                <div>
                    <label class="form-label">Chọn Khối học</label>
                    <div style="display: flex; gap: 10px;">
                        <select name="grade_id" class="form-control">
                            <option value="">-- Tất cả khối --</option>
                            {% for g in grades %}<option value="{{ g.id }}">{{ g.name }}</option>{% endfor %}
                        </select>
                        <a href="{% url 'learning:teacher_classes' %}" class="btn-add-quick" title="Tạo khối mới">+</a>
                    </div>
                </div>

                <div>
                    <label class="form-label">Chọn Lớp học</label>
                    <div style="display: flex; gap: 10px;">
                        <select name="class_id" class="form-control">
                            <option value="">-- Tất cả lớp --</option>
                            {% for c in classes %}<option value="{{ c.id }}">{{ c.name }}</option>{% endfor %}
                        </select>
                        <a href="{% url 'learning:teacher_classes' %}" class="btn-add-quick" title="Tạo lớp mới">+</a>
                    </div>
                </div>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 30px;">
                <div>
                    <label class="form-label">Chọn Môn học</label>
                    <div style="display: flex; gap: 10px;">
                        <select name="subject_id" class="form-control">
                            <option value="">-- Chọn môn --</option>
                            {% for s in subjects %}<option value="{{ s.id }}">{{ s.name }}</option>{% endfor %}
                        </select>
                        <a href="#" class="btn-add-quick" title="Tạo môn mới">+</a>
                    </div>
                </div>

                <div>
                    <label class="form-label" style="color: #10b981; font-weight: 800;">Chọn Bài học (Bắt buộc)</label>
                    <div style="display: flex; gap: 10px;">
                        <select name="lesson_id" required class="form-control" style="border: 2px solid #10b981;">
                            <option value="">-- Chọn bài học cụ thể --</option>
                            {% for l in lessons %}<option value="{{ l.id }}">Bài {{ l.order }}: {{ l.title }}</option>{% endfor %}
                        </select>
                        <a href="{% url 'learning:teacher_lesson_add' %}" class="btn-add-quick" style="background: #10b981; color: white;">+</a>
                    </div>
                </div>
            </div>

            <div style="background: #f8fafc; border: 2px dashed #cbd5e1; border-radius: 15px; padding: 30px; text-align: center; margin-bottom: 30px;">
                <input type="file" name="excel_file" accept=".xlsx" required id="file-upload" hidden>
                <label for="file-upload" style="cursor: pointer;">
                    <i class="fa-solid fa-file-excel" style="font-size: 40px; color: #10b981; margin-bottom: 10px;"></i>
                    <p id="file-name" style="margin: 0; color: #64748b;">Nhấn để chọn file Excel (.xlsx)</p>
                </label>
            </div>

            <button type="submit" class="btn-primary" style="width: 100%; padding: 15px; background: #10b981;">
                <i class="fa-solid fa-bolt"></i> Tiến hành Import ngay
            </button>
        </form>
    </div>
</div>

<style>
    .form-label { display: block; margin-bottom: 8px; font-weight: 600; color: #334155; }
    .form-control { flex: 1; padding: 12px; border-radius: 8px; border: 1px solid #ddd; outline: none; }
    .btn-add-quick { 
        width: 45px; height: 45px; display: flex; align-items: center; justify-content: center;
        background: #f1f5f9; color: #475569; border-radius: 8px; text-decoration: none;
        font-size: 20px; font-weight: bold; transition: 0.2s;
    }
    .btn-add-quick:hover { background: #e2e8f0; color: #1e293b; }
</style>

<script>
    // Hiển thị tên file khi chọn
    document.getElementById('file-upload').onchange = function() {
        document.getElementById('file-name').innerHTML = "Đã chọn: " + this.files[0].name;
        document.getElementById('file-name').style.color = "#10b981";
    };
</script>
{% endblock %}
