{% extends 'layouts/base.html' %}
{% block title %}Phòng Tập Trung (Pomodoro) - LMS Đa Môn{% endblock %}

{% block content %}
<div class="container" style="max-width: 600px; margin: 50px auto; padding: 40px; background: white; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); text-align: center;">
    
    <h2 style="color: #e74c3c; margin-bottom: 5px;">🍅 Phòng Tập Trung Tuyệt Đối</h2>
    <p style="color: #7f8c8d; margin-bottom: 30px;">Hoàn thành 25 phút để nhận XP. Rời tab sẽ bị phạt!</p>

    <div style="background-color: #2c3e50; color: white; width: 250px; height: 250px; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto; border: 10px solid #ecf0f1; box-shadow: 0 4px 15px rgba(0,0,0,0.2);">
        <span id="timer-display" style="font-size: 4em; font-weight: bold; font-family: monospace;">25:00</span>
    </div>

    <div id="status-message" style="margin-top: 20px; font-weight: bold; font-size: 1.2em; height: 30px; color: #27ae60;">
        Sẵn sàng chưa?
    </div>

    <div style="margin-top: 30px; display: flex; justify-content: center; gap: 15px;">
        <button id="btn-start" style="background-color: #27ae60; color: white; border: none; padding: 12px 30px; border-radius: 25px; font-size: 1.1em; font-weight: bold; cursor: pointer;">
            Bắt đầu Focus
        </button>
        <button id="btn-stop" style="background-color: #e74c3c; color: white; border: none; padding: 12px 30px; border-radius: 25px; font-size: 1.1em; font-weight: bold; cursor: pointer; display: none;">
            Hủy bỏ (Trừ XP)
        </button>
    </div>
</div>
{% endblock content %}
