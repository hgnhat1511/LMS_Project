<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trắc nghiệm 440 Từ Vựng Tiếng Anh</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #eef2f3; 
            color: #333; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
            padding: 20px;
        }
        .quiz-container { 
            background: #ffffff; 
            border-radius: 12px; 
            box-shadow: 0 8px 20px rgba(0,0,0,0.1); 
            width: 100%; 
            max-width: 600px; 
            padding: 30px; 
            box-sizing: border-box;
        }
        h1 { 
            text-align: center; 
            color: #2c3e50; 
            margin-top: 0;
            font-size: 1.6em;
        }
        .question-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            font-size: 0.95em;
            color: #7f8c8d;
            font-weight: bold;
            border-bottom: 2px solid #f0f2f5;
            padding-bottom: 10px;
        }
        .question { 
            font-size: 1.3em; 
            font-weight: 600; 
            margin-bottom: 20px; 
            color: #2c3e50;
            line-height: 1.4;
        }
        .options { 
            display: flex; 
            flex-direction: column; 
            gap: 12px; 
        }
        .option { 
            padding: 15px 20px; 
            background: #f8f9fa; 
            border: 2px solid #e9ecef; 
            border-radius: 8px; 
            cursor: pointer; 
            transition: all 0.2s; 
            font-size: 1em; 
            text-align: left; 
            color: #495057;
            font-weight: 500;
        }
        .option:hover { 
            background: #e9ecef; 
            border-color: #ced4da;
        }
        .option.correct { 
            background: #d1e7dd !important; 
            border-color: #198754 !important; 
            color: #0f5132 !important; 
        }
        .option.incorrect { 
            background: #f8d7da !important; 
            border-color: #dc3545 !important; 
            color: #842029 !important; 
        }
        .btn-next { 
            margin-top: 25px; 
            padding: 12px 20px; 
            background: #0d6efd; 
            color: #fff; 
            border: none; 
            border-radius: 8px; 
            cursor: pointer; 
            font-size: 1.1em; 
            width: 100%; 
            display: none; 
            font-weight: bold;
            transition: background 0.3s;
        }
        .btn-next:hover { 
            background: #0b5ed7; 
        }
        #result { 
            text-align: center; 
            display: none; 
        }
        #result h2 { 
            font-size: 2em; 
            margin-bottom: 10px; 
            color: #2c3e50;
        }
        .score { 
            font-size: 3em; 
            color: #0d6efd; 
            font-weight: bold; 
            margin: 20px 0;
        }
        .feedback {
            font-size: 1.1em;
            color: #6c757d;
            margin-bottom: 30px;
        }
        .tools-container {
            margin-top: 25px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            border-top: 2px solid #f0f2f5;
            padding-top: 20px;
        }
        .tools-container input {
            padding: 10px;
            width: 80px;
            border-radius: 6px;
            border: 1px solid #ced4da;
            font-size: 1em;
            text-align: center;
        }
        .tools-container button {
            padding: 10px 15px;
            background: #6c757d;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }
        .tools-container button:hover {
            background: #5c636a;
        }
    </style>
</head>
<body>
    <div class="quiz-container">
        <div id="quiz">
            <h1>Ôn tập 440 Từ Vựng Tiếng Anh</h1>
            <div class="question-header">
                <span id="question-count">Câu 1 / 440</span>
                <span id="score-live">Điểm: 0</span>
            </div>
            <div id="question-text" class="question"></div>
            <div id="options-container" class="options"></div>
            <button id="next-btn" class="btn-next" onclick="nextQuestion()">Câu tiếp theo</button>
            
            <div class="tools-container">
                <label for="jumpTo" style="color: #6c757d; font-weight: 500;">Nhảy đến câu:</label>
                <input type="number" id="jumpTo" min="1" max="440" placeholder="1-440">
                <button onclick="jumpToQuestion()">Đến</button>
            </div>
        </div>
        <div id="result">
            <h2>Hoàn thành!</h2>
            <div class="feedback">Bạn đã trả lời đúng:</div>
            <div id="score" class="score"></div>
            <button class="btn-next" style="display: block;" onclick="location.reload()">Làm lại từ đầu</button>
        </div>
    </div>

        let currentQuestionIndex = 0;
        let score = 0;
        let answered = false;

        const questionText = document.getElementById("question-text");
        const optionsContainer = document.getElementById("options-container");
        const nextBtn = document.getElementById("next-btn");
        const quizContainer = document.getElementById("quiz");
        const resultContainer = document.getElementById("result");
        const scoreText = document.getElementById("score");
        const questionCountText = document.getElementById("question-count");
        const scoreLiveText = document.getElementById("score-live");
        const jumpInput = document.getElementById("jumpTo");

        function loadQuestion() {
            answered = false;
            nextBtn.style.display = "none";
            const currentQ = quizData[currentQuestionIndex];
            
            questionCountText.innerText = `Câu ${currentQuestionIndex + 1} / ${quizData.length}`;
            scoreLiveText.innerText = `Điểm: ${score}`;
            questionText.innerText = currentQ.question;
            optionsContainer.innerHTML = "";
            jumpInput.value = currentQuestionIndex + 1;
            
            currentQ.options.forEach((option, index) => {
                const btn = document.createElement("button");
                btn.innerText = option;
                btn.classList.add("option");
                btn.onclick = () => selectOption(index, btn);
                optionsContainer.appendChild(btn);
            });
        }

        function selectOption(selectedIndex, btn) {
            if (answered) return;
            answered = true;
            const correctIndex = quizData[currentQuestionIndex].answer;
            const buttons = optionsContainer.querySelectorAll(".option");

            if (selectedIndex === correctIndex) {
                btn.classList.add("correct");
                score++;
                scoreLiveText.innerText = `Điểm: ${score}`;
            } else {
                btn.classList.add("incorrect");
                buttons[correctIndex].classList.add("correct");
            }

            buttons.forEach(b => b.style.cursor = "default");
            
            if (currentQuestionIndex === quizData.length - 1) {
                nextBtn.innerText = "Xem kết quả";
            }
            nextBtn.style.display = "block";
        }

        function nextQuestion() {
            currentQuestionIndex++;
            if (currentQuestionIndex < quizData.length) {
                loadQuestion();
            } else {
                showResult();
            }
        }
        
        function jumpToQuestion() {
            const val = parseInt(jumpInput.value);
            if (val >= 1 && val <= quizData.length) {
                currentQuestionIndex = val - 1;
                // Không reset điểm nếu nhảy lùi, nhưng để đơn giản, ta cứ giữ nguyên điểm hiện tại
                loadQuestion();
            } else {
                alert("Vui lòng nhập số câu hợp lệ từ 1 đến " + quizData.length);
            }
        }

        function showResult() {
            quizContainer.style.display = "none";

        loadQuestion();
